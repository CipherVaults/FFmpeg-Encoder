name: Shared core contracts (Linux and Windows)

on:
  push:
    branches: [blue/linux-development, codex/v0.7-candidate, blue/v07-source-mirror]
  pull_request:
    branches: [blue/linux-development, codex/v0.7-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node (no dependency cache)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check source syntax and selected current contracts
        run: node scripts/ci-source-contracts.cjs
