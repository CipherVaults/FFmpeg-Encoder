name: One-shot Ubuntu signed metadata lock proposal
on:
  push:
    branches: [blue/linux-development]
    paths: [.github/workflows/ubuntu-lock.yml]
permissions:
  contents: read
jobs:
  resolve:
    if: ${{ github.repository == 'CipherVaults/FFmpeg-Encoder-Blue-Linux' && github.ref == 'refs/heads/blue/linux-development' && github.event_name == 'push' && github.event.before == '2d3d80b01386ec2f53e40bc98b0f74514eb832da' && github.event.after == github.sha && github.event.forced == false && github.event.created == false && github.event.deleted == false && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact checked-out authority and source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_HEAD 2d3d80b01386ec2f53e40bc98b0f74514eb832da"
          printf '%s  %s\n' '35aa1cf927fae5573e43f8c2fcb419819c9cc03c4f6176f9e61e72d3a74ee798' 'scripts/ubuntu-lock/resolver.py' '89f674e94663879c9e4ab8e407aa1bacd484e59f40eba924764b2c2d5758eba8' 'scripts/ubuntu-lock/test_resolver.py' '511e06d82cb84f9486a2f40e7e71e7dc579cb08833218b6f6727e8b693cd8ffa' 'scripts/ubuntu-lock/signed_index.py' 'fbbdb615c6e8ae63082b61f6a425ab7d4ba9e4e46726447ccf9d120d9cf962b8' 'scripts/ubuntu-lock/test_signed_index.py' | sha256sum --check --strict
      - name: Inert controls
        run: |
          python3 scripts/ubuntu-lock/test_resolver.py
          python3 scripts/ubuntu-lock/test_signed_index.py
      - name: Signed metadata and simulation only
        run: timeout --signal=TERM --kill-after=5s 1210s python3 scripts/ubuntu-lock/resolver.py --resolve-once
      - name: Retain candidate report, not a release lock
        if: ${{ always() && hashFiles('scripts/ubuntu-lock/lock-report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/ubuntu-lock/lock-report.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
