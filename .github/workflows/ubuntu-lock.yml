name: One-shot Ubuntu signed metadata lock proposal
on:
  push:
    branches: [blue/linux-development]
    paths: [.github/workflows/ubuntu-lock.yml]
permissions:
  contents: read
jobs:
  resolve:
    if: ${{ github.repository == 'CipherVaults/FFmpeg-Encoder-Blue-Linux' && github.ref == 'refs/heads/blue/linux-development' && github.event_name == 'push' && github.event.before == '7ba5174e3d20833b69d1ce28f164db9b8f6d1f78' && github.event.after == github.sha && github.event.forced == false && github.event.created == false && github.event.deleted == false && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact checked-out authority and source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_HEAD 7ba5174e3d20833b69d1ce28f164db9b8f6d1f78"
          printf '%s  %s\n' '5a95ac5b0d5c92a733e2fdffbeacdad0f64ba5e7db450c0dd24b635e9717383b' 'scripts/ubuntu-lock/resolver.py' '25cb44e023331c8c6cacb2bf5d0caf4ecd5a0a2b3223eea8bff07f4803013237' 'scripts/ubuntu-lock/test_resolver.py' | sha256sum --check --strict
      - name: Inert controls
        run: python3 scripts/ubuntu-lock/test_resolver.py
      - name: Signed metadata and simulation only
        run: timeout --signal=TERM --kill-after=5s 1210s python3 scripts/ubuntu-lock/resolver.py --resolve-once
      - name: Retain candidate report, not a release lock
        if: ${{ always() && hashFiles('scripts/ubuntu-lock/lock-report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/ubuntu-lock/lock-report.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
